apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: energy-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/maxim283b/energy_forecast.git'
    targetRevision: develop
    path: helm/energy-api
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
