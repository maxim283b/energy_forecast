{{- if .Values.mlflow.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "energy-api.mlflowFullname" . }}
  labels:
    {{- include "energy-api.mlflowLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mlflow.replicaCount }}
  selector:
    matchLabels:
      {{- include "energy-api.mlflowSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "energy-api.mlflowLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: prepare-mlflow-storage
          image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
          imagePullPolicy: {{ .Values.mlflow.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p {{ .Values.mlflow.persistence.mountPath | quote }}
              mkdir -p {{ .Values.mlflow.artifactsDestination | quote }}
          volumeMounts:
            - name: mlflow-data
              mountPath: {{ .Values.mlflow.persistence.mountPath }}
      containers:
        - name: mlflow
          image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
          imagePullPolicy: {{ .Values.mlflow.image.pullPolicy }}
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.mlflow.service.port | quote }}
            - --backend-store-uri
            - {{ .Values.mlflow.backendStoreUri | quote }}
            - --serve-artifacts
            - --artifacts-destination
            - {{ .Values.mlflow.artifactsDestination | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.mlflow.service.port }}
              protocol: TCP
          volumeMounts:
            - name: mlflow-data
              mountPath: {{ .Values.mlflow.persistence.mountPath }}
          {{- with .Values.mlflow.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: mlflow-data
          {{- if .Values.mlflow.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "energy-api.mlflowFullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
