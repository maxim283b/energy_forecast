{{- if .Values.sharedWorkspace.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "energy-api.workspacePvcName" . }}
  labels:
    {{- include "energy-api.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.sharedWorkspace.accessMode }}
  resources:
    requests:
      storage: {{ .Values.sharedWorkspace.size }}
  {{- with .Values.sharedWorkspace.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
