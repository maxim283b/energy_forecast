{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "energy-api.fullname" . }}-prometheus-config
  labels:
    {{- include "energy-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: energy_api
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ include "energy-api.fullname" . }}:{{ .Values.service.port }}
{{- end }}
