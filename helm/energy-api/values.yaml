replicaCount: 1

image:
  repository: ghcr.io/maxim283b/energy_forecast/energy-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: NodePort
  port: 8000
  nodePort: null

env:
  MLFLOW_TRACKING_URI: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

mlflow:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/mlflow/mlflow
    pullPolicy: IfNotPresent
    tag: "v2.11.3"
  service:
    type: NodePort
    port: 5000
    nodePort: null
  backendStoreUri: "sqlite:////mlflow/db/mlflow.db"
  defaultArtifactRoot: "/mlflow/artifacts"
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
    mountPath: /mlflow
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: "v2.54.1"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 9090
    nodePort: null
  scrapeInterval: 15s
  resources: {}

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.2.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    nodePort: null
  adminUser: admin
  adminPassword: admin
  resources: {}
