services:
  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow_server_energy
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data/sqlite:/mlflow/db
      - ./mlflow_data/artifacts:/mlflow/artifacts
    command: >
      mlflow server 
      --backend-store-uri sqlite:////mlflow/db/mlflow.db 
      --default-artifact-root /mlflow/artifacts 
      --host 0.0.0.0
      --serve-artifacts

  energy_api:
    build: .
    container_name: energy_api_service
    depends_on:
      - mlflow_server
    ports:
      - "8080:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    volumes:
      - ./models:/app/models  # Позволяет обновлять модель без пересборки контейнера
    restart: always

  streamlit_ui:
    build: .
    container_name: energy_streamlit_ui
    depends_on:
      - energy_api
    ports:
      - "8501:8501"
    environment:
      - RETRAIN_API_URL=http://energy_api:8000/v1/retrain
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: >
      streamlit run src/ui/app.py
      --server.address 0.0.0.0
      --server.port 8501
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: energy_prometheus
    depends_on:
      - energy_api
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:11.2.0
    container_name: energy_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
