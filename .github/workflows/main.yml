name: CI/CD Pipeline

on:
  push:
    branches: [ main, "features/**", "infra/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Run Lint (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install DVC
        run: |
          pip install "dvc[gdrive]"

      - name: Pull data from DVC
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          # 1. Проверяем, что DVC Google credentials переданы
          if [ -z "$GDRIVE_CLIENT_ID" ] || [ -z "$GDRIVE_CLIENT_SECRET" ] || [ -z "$GDRIVE_REFRESH_TOKEN" ]; then
            echo "Missing DVC Google Drive credentials"
            exit 1
          fi

          # 2. Создаем директорию для кэша pydrive2 под текущий OAuth client
          mkdir -p "$HOME/.cache/pydrive2fs/$GDRIVE_CLIENT_ID/"

          # 3. Генерируем json-файл с токеном (исправленный формат)
          cat > "$HOME/.cache/pydrive2fs/$GDRIVE_CLIENT_ID/default.json" <<EOF
          {
            \"access_token\": \"dummy\",
            \"client_id\": \"$GDRIVE_CLIENT_ID\",
            \"client_secret\": \"$GDRIVE_CLIENT_SECRET\",
            \"refresh_token\": \"$GDRIVE_REFRESH_TOKEN\",
            \"token_expiry\": \"2020-01-01T00:00:00Z\",
            \"token_uri\": \"https://oauth2.googleapis.com/token\",
            \"user_agent\": \"dvc-pydrive2\",
            \"token_response\": {
              \"access_token\": \"dummy\",
              \"expires_in\": 3599,
              \"refresh_token\": \"$GDRIVE_REFRESH_TOKEN\",
              \"scope\": \"https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/drive.appdata\",
              \"token_type\": \"Bearer\"
            },
            \"scopes\": [
              \"https://www.googleapis.com/auth/drive\",
              \"https://www.googleapis.com/auth/drive.appdata\"
            ],
            \"invalid\": false,
            \"_class\": \"OAuth2Credentials\",
            \"_module\": \"oauth2client.client\"
          }
          EOF

          # 4. Тянем данные
          dvc pull

      - name: Build Docker image
        run: |
          mkdir -p data/models data/raw
          # Убеждаемся, что Dockerfile в корне и мы копируем всё дерево проекта
          docker build -t energy-api-service:latest -f Dockerfile .
