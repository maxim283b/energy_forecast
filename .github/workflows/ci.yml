name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'infra/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/energy-api:latest
            ghcr.io/${{ github.repository }}/energy-api:${{ github.sha }}

      - name: Update Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          perl -0pi -e 's/(^image:\n(?:  .+\n)*?  tag: ")[^"]+(")/$1$ENV{IMAGE_TAG}$2/m' helm/energy-api/values.yaml

      - name: Commit Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- helm/energy-api/values.yaml; then
            echo "Helm image tag is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/energy-api/values.yaml
          git commit -m "chore: update energy-api image tag to ${GITHUB_SHA} [skip ci]"
          git push
